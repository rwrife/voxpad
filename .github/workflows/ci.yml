name: CI

on:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.300

      - name: Restore
        run: dotnet restore voxpad.slnx

      - name: Test
        run: dotnet test voxpad.slnx --configuration Release --no-restore --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: test-results
          path: "**/TestResults/*.trx"
          if-no-files-found: error
          retention-days: 14

  package:
    name: package (${{ matrix.rid }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            artifact: voxpad-win-x64
            package: windows
          - os: macos-latest
            rid: osx-arm64
            artifact: voxpad-osx-arm64
            package: macos
          - os: macos-latest
            rid: osx-x64
            artifact: voxpad-osx-x64
            package: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 10.0.300

      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use semantic versioning without prerelease metadata, for example v1.2.3." >&2
            exit 1
          fi

      - name: Publish desktop app
        shell: bash
        run: >-
          dotnet publish src/Voxpad.Desktop/Voxpad.Desktop.csproj
          --configuration Release
          --runtime "${{ matrix.rid }}"
          --self-contained true
          --output "artifacts/publish/${{ matrix.rid }}"
          -p:DebugSymbols=false
          -p:DebugType=None

      - name: Package Windows portable ZIP
        if: matrix.package == 'windows'
        shell: pwsh
        run: >-
          ./scripts/package-windows.ps1
          -PublishDirectory "artifacts/publish/${{ matrix.rid }}"
          -OutputDirectory "artifacts/package"
          -RuntimeIdentifier "${{ matrix.rid }}"

      - name: Package macOS application and DMG
        if: matrix.package == 'macos'
        shell: bash
        run: >-
          ./scripts/package-macos.sh
          "artifacts/publish/${{ matrix.rid }}"
          "artifacts/package"
          "${{ matrix.rid }}"
          "${GITHUB_REF_NAME#v}"

      - name: Upload desktop package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: artifacts/package/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download packaged artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: voxpad-*
          path: release
          merge-multiple: true

      - name: Publish GitHub release assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          files: release/*
          generate_release_notes: true
